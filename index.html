<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>刘劭喆 · 个人主页</title>
    <link rel="icon" href="favicon.ico?v=20260903">
    <meta name="description" content="刘劭喆的个人主页 · 独立开发者 · 北京大学">
    <meta name="keywords" content="刘劭喆, Shaozhe Liu, Personal Website">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./static/css/style.css?v=2.1">
    <script>
        (function () {
            var theme = document.cookie.match(/themeState=([^;]+)/);
            var state = theme ? theme[1] : 'Dark';
            document.documentElement.setAttribute('data-theme', state === 'Light' ? 'light' : 'dark');
        })();
    </script>
</head>

<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="logo-mark" href="#home" aria-label="首页">
                <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="28" height="28" rx="8" fill="currentColor" />
                    <path d="M8 20.5L14 8L20 20.5" stroke="var(--logo-ink)" stroke-width="1.7" stroke-linejoin="round" />
                    <path d="M10.2 16.2H17.8" stroke="var(--logo-ink)" stroke-width="1.7" stroke-linecap="round" />
                </svg>
            </a>
            <nav class="site-nav" aria-label="主导航">
                <a href="#home" class="nav-link is-active">首页</a>
                <a href="#about" class="nav-link">关于</a>
                <a href="#projects" class="nav-link">项目</a>
            </nav>
            <button type="button" class="theme-toggle" id="theme-toggle" aria-label="切换明暗模式">
                <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.6" />
                    <path d="M12 2.5V5M12 19v2.5M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M2.5 12H5M19 12h2.5M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
                </svg>
                <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M19.5 14.2A7.5 7.5 0 0 1 9.8 4.5 7.5 7.5 0 1 0 19.5 14.2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
                </svg>
            </button>
        </div>
    </header>

    <main>
        <section id="home" class="hero">
            <canvas id="starfield" class="starfield" aria-hidden="true"></canvas>
            <div class="container hero-inner">
                <div class="hero-copy">
                    <div class="badge">独立开发者 · 北京大学</div>
                    <h1 class="hero-name">刘劭喆</h1>
                    <h2 class="hero-sub">Vibe coding 重度患者</h2>
                    <p class="hero-tagline">爱我所爱，行我所行，听从我心，无问西东。</p>
                    <div class="social-row">
                        <a class="pill-link" href="https://github.com/shaozheliu" target="_blank" rel="noopener">GitHub</a>
                        <a class="pill-link" href="https://space.bilibili.com/626885218" target="_blank" rel="noopener">Bilibili</a>
                        <a class="pill-link" href="https://www.xiaohongshu.com/user/profile/你的小红书ID" target="_blank" rel="noopener">小红书</a>
                    </div>
                </div>
                <div class="hero-avatar">
                    <img src="./static/img/avatar.png?v=20250810" alt="刘劭喆" width="300" height="300">
                </div>
            </div>
        </section>

        <section id="about" class="about">
            <div class="container">
                <h2 class="section-title">关于</h2>
                <div class="about-copy">
                    <p>我是刘劭喆，毕业于北京大学。</p>
                    <p>我关注人机交互、机器学习，以及用生理时序数据做健康相关的应用。欢迎沟通交流</p>
                </div>
                <ul class="about-points">
                    <li>人机交互、机器学习，和时序数据建模</li>
                    <li>个人SOP的设计与搭建</li>
                    <li>把想法做成能用的东西</li>
                </ul>
                <p class="about-place">广东 深圳</p>
            </div>
        </section>

        <section id="projects" class="projects">
            <div class="container">
                <div class="section-heading">
                    <h2 class="section-title">项目</h2>
                    <p class="section-desc">我的一些项目，欢迎试用。</p>
                </div>

                <div class="project-featured" id="project-featured"></div>
                <div class="project-gallery" id="project-gallery" hidden></div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>© 2026 刘劭喆</p>
            <p>爱我所爱，行我所行，听从我心，无问西东</p>
        </div>
    </footer>

    <script src="./static/js/script.js?v=2.1"></script>
</body>

</html>
